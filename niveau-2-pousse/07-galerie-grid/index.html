<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Le grand marché en images</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== EN-TÊTE ===== -->
  <header>
    <h1>Le grand marché en images</h1>
    <p>Un samedi matin au marché : les étals, les couleurs et les produits de nos producteurs.</p>
  </header>

  <!-- ===== GALERIE : 12 figures, des images de proportions différentes ===== -->
  <main>
    <div class="galerie">

      <!-- Image panoramique (960 × 360) : sur toute la largeur de la galerie -->
      <figure class="panorama">
        <img src="images/etal-du-marche.svg" alt="Trois étals du marché sous des auvents verts, chargés de fruits et de légumes" width="960" height="360">
        <figcaption>L'allée des fruits et légumes, dès 6 heures du matin.</figcaption>
      </figure>

      <!-- Image carrée (400 × 400) -->
      <figure>
        <img src="images/panier-de-fruits.svg" alt="Panier tressé rempli de fruits colorés" width="400" height="400">
        <figcaption>Le panier de la semaine</figcaption>
      </figure>

      <!-- Image en hauteur (300 × 450) : occupe deux rangées -->
      <figure class="haute">
        <img src="images/ananas.svg" alt="Ananas mûr avec sa couronne de feuilles" width="300" height="450">
        <figcaption>L'ananas, cueilli la veille</figcaption>
      </figure>

      <!-- Photo (800 × 533) -->
      <figure>
        <img src="images/parcelle-800.webp" alt="Champ cultivé en rangs sous le soleil, avec une ferme au loin" width="800" height="533">
        <figcaption>Les champs des producteurs</figcaption>
      </figure>

      <!-- Illustrations (400 × 300) -->
      <figure>
        <img src="images/mangue.svg" alt="Mangue mûre, jaune et rouge" width="400" height="300">
        <figcaption>La mangue</figcaption>
      </figure>

      <figure>
        <img src="images/tomate.svg" alt="Tomate rouge et ronde avec sa tige verte" width="400" height="300">
        <figcaption>La tomate</figcaption>
      </figure>

      <figure>
        <img src="images/piment.svg" alt="Piment rouge allongé et recourbé" width="400" height="300">
        <figcaption>Le piment</figcaption>
      </figure>

      <figure>
        <img src="images/banane.svg" alt="Régime de trois bananes jaunes" width="400" height="300">
        <figcaption>La banane</figcaption>
      </figure>

      <figure>
        <img src="images/cacao.svg" alt="Cabosse de cacao orange et brune" width="400" height="300">
        <figcaption>La cabosse de cacao</figcaption>
      </figure>

      <figure>
        <img src="images/mais.svg" alt="Épi de maïs jaune entouré de ses feuilles vertes" width="400" height="300">
        <figcaption>Le maïs</figcaption>
      </figure>

      <figure>
        <img src="images/riz.svg" alt="Plant de riz avec ses épis de grains qui retombent" width="400" height="300">
        <figcaption>Le riz</figcaption>
      </figure>

      <figure>
        <img src="images/poule.svg" alt="Poule rousse à crête rouge" width="400" height="300">
        <figcaption>Le stand des œufs frais</figcaption>
      </figure>

    </div>
  </main>

  <!-- ===== PIED DE PAGE ===== -->
  <footer>
    <p>© 2026 Le grand marché — Illustrations : DFS, sprint 1 — Exercice 07</p>
  </footer>

</body>
</html>
